# Requires approval of paid service and disk before applying.
services:
  - type: web
    name: hf-intern-quest
    runtime: python
    plan: starter
    region: singapore
    branch: main
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    autoDeployTrigger: commit
    healthCheckPath: /api/me
    envVars:
      - key: HF_BIND
        value: 0.0.0.0
      - key: HF_HTTPS
        value: "1"
      - key: HF_DATA
        value: /var/data
      - key: HF_ADMIN_SEED
        sync: false
    disk:
      name: hf-accounts
      mountPath: /var/data
      sizeGB: 1
