# Free web service; external Neon Free Postgres stores account data.
services:
  - type: web
    name: hf-intern-quest
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    autoDeployTrigger: commit
    healthCheckPath: /api/me
    envVars:
      - key: HF_BIND
        value: 0.0.0.0
      - key: HF_HTTPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: HF_ADMIN_SEED
        sync: false
